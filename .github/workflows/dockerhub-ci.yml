name: Docker Hub

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verificar que el secret no esté vacío
      - name: Verify Docker Hub username
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME_GENESIS }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME_GENESIS secret is empty or not set"
            exit 1
          else
            echo "Username secret is set correctly"
          fi

      # 3. Login a Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_GENESIS }}
          password: ${{ secrets.DOCKERHUB_TOKEN_GENESIS }}

      # 3. Build y Push con tags latest y SHA
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            genesis2006/as241s5_aej_34-fe:latest
            genesis2006/as241s5_aej_34-fe:${{ github.sha }}
